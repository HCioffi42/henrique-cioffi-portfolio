# HC: Caps the container log files. Docker's json-file driver keeps no limit of its own, and the
# host declares no daemon-wide default, so each container log is an unbounded writer on the root
# volume. Ordinary traffic would take decades to matter; what this guards against is the anomaly
# — a sustained scanner, or a service that starts logging in a loop — where the volume fills and
# takes the database down with it. Five files of ten megabytes bounds each service at fifty,
# which at the observed rate is still several weeks of history to read back.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Database Service: Persistent PostgreSQL instance
  database:
    image: postgres:16-alpine
    container_name: meu_site_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=meu_site_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    # HC: No host port is published. The database is reached by service name over the
    # blog-network bridge; administrative access goes through 'docker exec'.
    volumes:
      # HC: Using the named volume found on the server for better persistence
      - postgres_production_data:/var/lib/postgresql/data
    networks:
      - blog-network
    logging: *default-logging

  # Backend Service: .NET 8 Web API
  backend:
    image: henriquecioffi/meu-site-api:latest
    container_name: meu_site_api
    restart: always
    depends_on:
      - database
    environment:
      # HC: Notice the Host is set to 'database' to match the service name above.
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - EmailSettings__Password=${RESEND_API_KEY}
      - EmailSettings__Host=smtp.resend.com
      - EmailSettings__Username=resend
      - JwtSettings__Key=${JWT_SIGNING_KEY}
    # HC: No host port is published. All external traffic reaches the API through the
    # frontend's Nginx reverse proxy, which is the single ingress.
    volumes:
      # HC: Matches the upload folder to the named volume
      - blog_uploads:/app/wwwroot/uploads
    networks:
      - blog-network
    logging: *default-logging

  # Frontend Service: React Application (Vite + Nginx)
  frontend:
    image: henriquecioffi/meu-site-web:latest
    container_name: meu_site_web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - blog-network
    logging: *default-logging

# Network definition to allow services to communicate by name
networks:
  blog-network:
    driver: bridge
    
# HC: Definitions for the persistent volumes
volumes:
  postgres_production_data:
  blog_uploads: