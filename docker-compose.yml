services:
  # Database Service: Persistent PostgreSQL instance
  database:
    image: postgres:16-alpine
    container_name: meu_site_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=meu_site_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # HC: Using the named volume found on the server for better persistence
      - postgres_production_data:/var/lib/postgresql/data
    networks:
      - blog-network

  # Backend Service: .NET 8 Web API
  backend:
    image: henriquecioffi/meu-site-api:latest
    container_name: meu_site_api
    restart: always
    depends_on:
      - database
    environment:
      # HC: Notice the Host is set to 'database' to match the service name above.
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - EmailSettings__Password=${RESEND_API_KEY}
      - EmailSettings__Host=smtp.resend.com
      - EmailSettings__Username=resend
    ports:
      - "5000:8080"
    volumes:
      # HC: Matches the upload folder to the named volume
      - blog_uploads:/app/wwwroot/uploads
    networks:
      - blog-network

  # Frontend Service: React Application (Vite + Nginx)
  frontend:
    image: henriquecioffi/meu-site-web:latest
    container_name: meu_site_web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - blog-network

# Network definition to allow services to communicate by name
networks:
  blog-network:
    driver: bridge
    
# HC: Definitions for the persistent volumes
volumes:
  postgres_production_data:
  blog_uploads: