name: Production Deployment

on:
  push:
    branches:
      # Filters branches following the strict pattern: release/v20XX.XX.XX.XX
      - 'release/v20[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extracts the version number from the branch name to use as a Docker tag
      - name: Extract version tag from branch
        id: vars
        run: echo "tag=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Builds the Frontend image and pushes it with both versioned and latest tags
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./meupessoal-web
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            henriquecioffi/meu-site-web:${{ steps.vars.outputs.tag }}
            henriquecioffi/meu-site-web:latest

      # Builds the Backend image and pushes it with both versioned and latest tags
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./meupessoal-api
          push: true
          tags: |
            henriquecioffi/meu-site-api:${{ steps.vars.outputs.tag }}
            henriquecioffi/meu-site-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Connects to Oracle Cloud via SSH to update the services
      - name: SSH Deploy to Oracle Cloud
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/blog-portfolio
            docker compose pull
            docker compose up -d