name: Production Deployment

on:
  push:
    branches:
      # Filters branches following the strict pattern: release/v20XX.XX.XX.XX
      - 'release/v20[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extracts the version number from the branch name to use as a Docker tag
      - name: Extract version tag from branch
        id: vars
        run: echo "tag=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Builds the Frontend image and pushes it with both versioned and latest tags
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./meupessoal-web
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            henriquecioffi/meu-site-web:${{ steps.vars.outputs.tag }}
            henriquecioffi/meu-site-web:latest

      # Builds the Backend image and pushes it with both versioned and latest tags
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./Dockerfile
          push: true
          tags: |
            henriquecioffi/meu-site-api:${{ steps.vars.outputs.tag }}
            henriquecioffi/meu-site-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Connects to Oracle Cloud via SSH to update the services.
      # Pinned to a commit rather than a branch or tag: this third-party action receives the
      # production SSH key, and a branch or tag can be moved to different code without this
      # workflow changing. A SHA cannot. To upgrade, resolve the new release tag to its commit
      # and replace both the SHA and the version comment.
      - name: SSH Deploy to Oracle Cloud
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Stops at the first failing command. Without this the step reported the exit code of
          # the last command alone, so a failed checkout update was masked by a successful
          # 'docker compose up' and the server ran a stale compose file for months unnoticed.
          #
          # The checkout is moved to the release with fetch and reset rather than pull. A pull
          # merges into whatever the server holds and refuses when a tracked file was edited by
          # hand; the reset makes the server's tracked files exactly the release, every time.
          # Untracked files such as .env are not touched by a reset.
          script: |
            set -e
            cd ~/blog-portfolio
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"
            docker compose pull
            docker compose up -d