name: CI - Build and Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  # Job 1: Backend (.NET) Validation
  backend-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password_ci_test
          POSTGRES_DB: MeuSiteDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Backend
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=MeuSiteDb;Username=postgres;Password=password_ci_test;Include Error Detail=true"

  # Job 2: Frontend (React) Validation
  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./meupessoal-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './meupessoal-web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Build Frontend
        run: npm run build